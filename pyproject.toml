[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastboot-oem-extractor"
version = "1.0.2"
description = 'Extract hidden "fastboot oem" commands from firmware blobs'
authors = [{ name = "chkndrp", email = "chkndrp@gmail.com" }]
keywords = [
    "android", "fastboot", "oem", "extractor", "research",
    "uefi", "lk", "abl", "bootloader", "cli", "library"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Environment :: Console",
    "Typing :: Typed"
]
dependencies = [
    "uefi_firmware==1.16"
]
license = "LGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/chkndrp/fastboot-oem-extractor"
Issues     = "https://github.com/chkndrp/fastboot-oem-extractor/issues"
Changelog  = "https://github.com/chkndrp/fastboot-oem-extractor/blob/master/CHANGELOG.md"
Homepage   = "https://github.com/chkndrp/fastboot-oem-extractor/blob/master/README.md"

[project.optional-dependencies]
dev = [
    "pylint>=4.1.3",
]

[project.scripts]
fastboot-oem-extractor = "fastboot_oem_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["fastboot_oem_extractor*"]
where = ["src"]
exclude = [".github"]
